<!doctype html>
<html lang="ru">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Notes Sync Bridge</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        color: #444;
        font: 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p id="status">Notes Sync Bridge</p>
    <script>
      (function () {
        var APP_SOURCE = 'notes-app-bridge';
        var BRIDGE_SOURCE = 'notes-drive-bridge';
        var CHANNEL = String(Date.now()) + '-' + Math.random().toString(36).slice(2);
        var status = document.getElementById('status');
        var port = null;

        function send(message) {
          if (port) {
            port.postMessage(message);
          }
        }

        function handleRequest(event) {
          var data = event.data;
          if (!data || data.source !== APP_SOURCE) return;
          if (data.channel !== CHANNEL) return;
          if (!data.id) return;

          status.textContent = 'Working…';
          google.script.run
            .withSuccessHandler(function (response) {
              var payload = response || {};
              if (payload.ok) {
                send({
                  source: BRIDGE_SOURCE,
                  channel: CHANNEL,
                  id: data.id,
                  ok: true,
                  result: payload.result
                });
              } else {
                send({
                  source: BRIDGE_SOURCE,
                  channel: CHANNEL,
                  id: data.id,
                  ok: false,
                  error: payload.error || 'Неизвестная ошибка Apps Script'
                });
              }
              status.textContent = 'Connected';
            })
            .withFailureHandler(function (error) {
              send({
                source: BRIDGE_SOURCE,
                channel: CHANNEL,
                id: data.id,
                ok: false,
                error: error && error.message ? error.message : String(error)
              });
              status.textContent = 'Error';
            })
            .bridge(JSON.stringify(data.request || {}));
        }

        // Apps Script wraps this HTML in a second sandboxed iframe. Pass a
        // dedicated MessagePort to the top-level app; no window messages need
        // to cross Google's wrapper.
        var channel = new MessageChannel();
        port = channel.port1;
        port.onmessage = handleRequest;
        port.start();
        window.top.postMessage(
          {
            source: BRIDGE_SOURCE,
            type: 'ready',
            channel: CHANNEL
          },
          '*',
          [channel.port2]
        );
        status.textContent = 'Connected';
      })();
    </script>
  </body>
</html>
