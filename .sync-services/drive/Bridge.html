<!doctype html>
<html lang="ru">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Notes Sync Bridge</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        color: #444;
        font: 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p id="status">Notes Sync Bridge</p>
    <script>
      (function () {
        var APP_SOURCE = 'notes-app-bridge';
        var BRIDGE_SOURCE = 'notes-drive-bridge';
        var CHANNEL = String(Date.now()) + '-' + Math.random().toString(36).slice(2);
        var status = document.getElementById('status');
        var readyTimer = null;

        function send(message) {
          // Apps Script wraps user HTML in a second sandboxed iframe. Its
          // direct parent is Google's wrapper, so messages must go to top.
          window.top.postMessage(message, '*');
        }

        function ready() {
          status.textContent = 'Connected';
          send({
            source: BRIDGE_SOURCE,
            type: 'ready',
            channel: CHANNEL
          });
        }

        // The app may start listening after the document loads. Repeat ready
        // until the app sends the first request.
        ready();
        readyTimer = setInterval(ready, 1000);

        window.addEventListener('message', function (event) {
          if (event.source !== window.top) return;
          var data = event.data;
          if (!data || data.source !== APP_SOURCE) return;
          if (data.channel !== CHANNEL) return;

          if (readyTimer) {
            clearInterval(readyTimer);
            readyTimer = null;
          }
          if (!data.id) return;

          status.textContent = 'Working…';
          google.script.run
            .withSuccessHandler(function (response) {
              var payload = response || {};
              if (payload.ok) {
                send({
                  source: BRIDGE_SOURCE,
                  channel: CHANNEL,
                  id: data.id,
                  ok: true,
                  result: payload.result
                });
              } else {
                send({
                  source: BRIDGE_SOURCE,
                  channel: CHANNEL,
                  id: data.id,
                  ok: false,
                  error: payload.error || 'Неизвестная ошибка Apps Script'
                });
              }
              status.textContent = 'Connected';
            })
            .withFailureHandler(function (error) {
              send({
                source: BRIDGE_SOURCE,
                channel: CHANNEL,
                id: data.id,
                ok: false,
                error: error && error.message ? error.message : String(error)
              });
              status.textContent = 'Error';
            })
            .bridge(JSON.stringify(data.request || {}));
        });
      })();
    </script>
  </body>
</html>
